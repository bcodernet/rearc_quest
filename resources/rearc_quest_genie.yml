# Genie Agent for Rearc Data Quest — natural language Q&A over gold + silver tables
#
# The space is defined inline as `serialized_space` rather than via `file_path`, because
# the table identifiers need to follow the deploy target's catalog. Bundle variables are
# substituted in inline config but NOT in the contents of a referenced file, and
# `genie_spaces` has no `dataset_catalog`/`dataset_schema` escape hatch the way
# `dashboards` does. Referencing ../genie/rearc_quest_genie.geniespace.json would
# therefore pin every table to `dev`, so a prod deploy would ship a Genie space that
# silently queries dev data.

resources:
  genie_spaces:
    rearc_quest_genie:
      title: 'Rearc Data Quest'
      description: 'Ask questions about BLS labor statistics and US population data in natural language'
      warehouse_id: ${var.warehouse_id}
      permissions:
        - level: CAN_RUN
          group_name: users

      serialized_space:
        version: 2
        config:
          sample_questions:
            - id: 698a753a14fa4ee09a711ec9277beabe
              question:
                - "What are the mean and standard deviation of the annual US population across 2013-2018 inclusive?"
            - id: 91cfa136b6784bd2b20986f8c72d0b6d
              question:
                - "For every series_id in the BLS data, what's the best year, meaning the year with the largest sum of value across all its quarters?"
            - id: 40a06d4f320042cc8e454013e32b731e
              question:
                - "For series_id PRS30006032 and period Q01, what was the value each year, joined with that year's population where available?"
            - id: c90b2de18aa94029bdde3c52583d9f88
              question:
                - "What BLS series had the highest yearly sum, and what year was that?"
            - id: 1c3317ca060d4de3935c673bb216a14b
              question:
                - "How does the US population trend from 2013 to 2018?"
        data_sources:
          tables:
            - identifier: ${var.catalog}.${var.gold_schema}.gold_q1_pop_stats
              column_configs:
                - column_name: mean_population
                - column_name: stddev_population
            - identifier: ${var.catalog}.${var.gold_schema}.gold_q2_best_year
              column_configs:
                - column_name: series_id
                - column_name: series_title
                - column_name: year
                - column_name: yearly_sum
            - identifier: ${var.catalog}.${var.gold_schema}.gold_q3_value_pop
              column_configs:
                - column_name: population
                - column_name: value
                - column_name: year
            - identifier: ${var.catalog}.${var.silver_schema}.silver_bls
              column_configs:
                - column_name: class_text
                - column_name: duration_text
                - column_name: measure_text
                - column_name: period
                - column_name: seasonal
                - column_name: sector_name
                - column_name: series_id
                - column_name: series_title
                - column_name: value
                - column_name: year
            - identifier: ${var.catalog}.${var.silver_schema}.silver_population
              column_configs:
                - column_name: population
                - column_name: year

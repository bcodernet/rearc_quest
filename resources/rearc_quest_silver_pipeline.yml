# Silver SDP pipeline — reads from dev.bronze → publishes to dev.silver

resources:
  pipelines:
    rearc_quest_silver_pipeline:
      name: rearc_quest_silver_pipeline

      catalog: ${var.catalog}
      target: ${var.silver_schema}

      channel: current
      serverless: true
      continuous: false
      photon: true

      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}

      libraries:
        - notebook:
            path: ../src/pipeline/silver/silver_bls.py
        - notebook:
            path: ../src/pipeline/silver/silver_population.py

# Declarative Automation Bundle configuration
# Docs: https://docs.databricks.com/en/dev-tools/bundles/settings.html

bundle:
  name: rearc_quest
  engine: direct  # required for genie_spaces resources

variables:
  catalog:
    description: >-
      Unity Catalog where all schemas and tables live. Overridden per target below, so
      `--target prod` publishes into the prod catalog rather than on top of dev data.
    default: dev

  bronze_schema:
    description: Schema for bronze (raw) tables
    default: bronze

  silver_schema:
    description: Schema for silver (cleansed) tables
    default: silver

  gold_schema:
    description: Schema for gold (analytical) tables
    default: gold

  volume_name:
    description: UC Volume under the bronze schema for raw file landing
    default: raw

  warehouse_id:
    description: >-
      SQL warehouse backing the dashboard and Genie space. Resolved by name at deploy
      time rather than hardcoded, so the bundle is portable across workspaces where the
      warehouse ID differs.
    lookup:
      warehouse: Serverless Starter Warehouse

include:
  - resources/*.yml

targets:
  # Development target — default for local iteration
  dev:
    mode: development
    default: true
    variables:
      catalog: dev
    workspace:
      host: https://dbc-75fe95ff-8201.cloud.databricks.com

  # Production target — stable root path and run-as identity.
  # Shares one workspace with dev (trial account), so catalog is the isolation
  # boundary: prod publishes to the `prod` catalog and never touches dev data.
  prod:
    mode: production
    variables:
      catalog: prod
    workspace:
      host: https://dbc-75fe95ff-8201.cloud.databricks.com
      root_path: /Users/bcodernet@gmail.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: bcodernet@gmail.com
